# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - cosmos-mongo-estudiante

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build HerreraSystemAPI/HerreraSystem.API.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish HerreraSystemAPI/HerreraSystem.API.csproj -c Release --no-build -o ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cosmos-mongo-estudiante'
          slot-name: 'Production'
          package: ./publish
          startup-command: dotnet HerreraSystem.API.dll
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_12095F3922C442CD8E3E31C03A466740 }}
