name: Build and deploy ASP.Net Core app to Azure Web App - SorbeteriaHerreraAppService

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Build API
        run: dotnet build HerreraSystemAPI/HerreraSystem.API.csproj --configuration Release
      - name: Publish API only
        run: dotnet publish HerreraSystemAPI/HerreraSystem.API.csproj -c Release --no-build -o ./publish
      - name: Verify API deployment files
        run: |
          test -f ./publish/HerreraSystem.API.dll
          test -f ./publish/HerreraSystem.API.runtimeconfig.json
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_885CE772461E430299E42A6E8F4A7FB4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C407A86CDF7248DEAB7608EC23D5D14C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_05937963F9B347A28974EDC2B0260DAE }}
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: SorbeteriaHerreraAppService
          slot-name: Production
          package: ./publish
          startup-command: dotnet HerreraSystem.API.dll
